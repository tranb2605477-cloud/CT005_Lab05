<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic và Video YouTube</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf4ff, #ffffff);
            color: #1f2937;
        }

        header {
            padding: 32px 20px;
            text-align: center;
            background: #1261a0;
            color: white;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            font-size: 17px;
        }

        main {
            width: min(1100px, 92%);
            margin: 35px auto;
        }

        section {
            margin-bottom: 35px;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            color: #1261a0;
            text-align: center;
        }

        .infographic {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 8px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }

        .video-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            padding: 22px;
            text-align: center;
            background: #17324d;
            color: white;
            font-size: 14px;
            line-height: 1.6;
        }

        footer a {
            color: #9ed8ff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Infographic và Video YouTube</h1>
        <p>Nội dung trực quan kết hợp hình ảnh và video minh họa</p>
    </header>

    <main>
        <section>
            <h2>Infographic</h2>

            <!-- Đặt file Lab05_Ex2.1.png cùng thư mục với file HTML -->
            <img
                class="infographic"
                src="Lab05_Ex2.1.png"
                alt="Infographic Lab 05 Exercise 2.1">
        </section>

        <section>
            <h2>Video YouTube</h2>

            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube.com/embed/0bZMqeVrcBo"
                    title="Video YouTube minh họa"
                    allowfullscreen>
                </iframe>
            </div>
        </section>
    </main>

    <footer>
        <div>
            © 2026 - Bản quyền nội dung thuộc về tác giả.
        </div>
        <div>
            Nguồn video:
            <a href="https://youtu.be/0bZMqeVrcBo" target="_blank">
                YouTube
            </a>
        </div>
        <div>
            Trang được thực hiện với sự hỗ trợ của AI.
        </div>
    </footer>

</body>
</html>
